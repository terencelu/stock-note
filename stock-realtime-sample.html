<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台積電 (2330) 即時股價監控</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 400px;
            padding: 24px;
            position: relative;
        }

        /* 頂部導覽區，包含右側 test 按鈕 */
        .top-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 12px;
        }

        .nav-test-btn {
            background-color: #007AFF;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 16px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .nav-test-btn:hover {
            opacity: 0.85;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            border-bottom: 1px solid #eee;
            padding-bottom: 12px;
            margin-bottom: 20px;
        }

        .symbol {
            font-size: 1.5rem;
            font-weight: bold;
            color: #1a1a1a;
        }

        .code {
            font-size: 0.9rem;
            color: #666;
        }

        .price-section {
            text-align: center;
            margin-bottom: 20px;
        }

        .price-label {
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 4px;
        }

        .current-price {
            font-size: 2.8rem;
            font-weight: bold;
            color: #333;
            transition: color 0.3s ease;
        }

        .change-section {
            font-size: 1.1rem;
            font-weight: 600;
            margin-top: 4px;
        }

        /* 樣式設定：上漲顯示紅色、下跌顯示綠色（台股規則） */
        .up { color: #e53935; }
        .down { color: #43a047; }
        .flat { color: #666666; }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            background: #f8f9fa;
            padding: 16px;
            border-radius: 8px;
            margin-top: 16px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-label {
            font-size: 0.8rem;
            color: #666;
            margin-bottom: 4px;
        }

        .stat-value {
            font-size: 1.25rem;
            font-weight: 600;
            color: #333;
        }

        .footer {
            margin-top: 16px;
            font-size: 0.75rem;
            color: #999;
            text-align: center;
        }

        .loading {
            opacity: 0.5;
        }
    </style>
</head>
<body>

    <div class="card" id="stockCard">
        <!-- 右上角 test 按鈕 -->
        <div class="top-bar">
            <button class="nav-test-btn" onclick="location.href='./index.html'">test</button>
        </div>

        <div class="header">
            <span class="symbol" id="stockName">台積電</span>
            <span class="code" id="stockCode">2330</span>
        </div>

        <div class="price-section">
            <div class="price-label">即時價格 (TWD)</div>
            <div class="current-price" id="currentPrice">---</div>
            <div class="change-section" id="changeSection">--</div>
        </div>

        <div class="stats-grid">
            <div class="stat-item">
                <div class="stat-label">今日最高價</div>
                <div class="stat-value" id="highPrice">---</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">今日最低價</div>
                <div class="stat-value" id="lowPrice">---</div>
            </div>
            <div class="stat-item" style="grid-column: span 2; margin-top: 8px; border-top: 1px dashed #ddd; padding-top: 8px;">
                <div class="stat-label">成交量 (張)</div>
                <div class="stat-value" id="volume">---</div>
            </div>
        </div>

        <div class="footer">
            資料時間: <span id="updateTime">--:--:--</span>
        </div>
    </div>

    <script>
        const API_URL = 'https://stock-note-vjok.onrender.com/api/stock/2330';

        async function fetchStockData() {
            try {
                const response = await fetch(API_URL);
                const result = await response.json();

                if (result.success && result.data) {
                    const stock = result.data;

                    // 1. 基本資訊
                    document.getElementById('stockName').innerText = stock.name;
                    document.getElementById('stockCode').innerText = stock.code;
                    document.getElementById('currentPrice').innerText = stock.price.toLocaleString();
                    document.getElementById('highPrice').innerText = stock.high.toLocaleString();
                    document.getElementById('lowPrice').innerText = stock.low.toLocaleString();
                    document.getElementById('volume').innerText = stock.volume.toLocaleString();
                    document.getElementById('updateTime').innerText = stock.time;

                    // 2. 計算漲跌狀態與標示顏色 (符合台股紅漲綠跌慣例)
                    const changeEl = document.getElementById('changeSection');
                    const priceEl = document.getElementById('currentPrice');

                    const changePercent = ((stock.change / stock.yesterdayClose) * 100).toFixed(2);
                    
                    let changeText = '';
                    let colorClass = 'flat';

                    if (stock.change > 0) {
                        changeText = `▲ +${stock.change} (+${changePercent}%)`;
                        colorClass = 'up';
                    } else if (stock.change < 0) {
                        changeText = `▼ ${stock.change} (${changePercent}%)`;
                        colorClass = 'down';
                    } else {
                        changeText = `0.00`;
                        colorClass = 'flat';
                    }

                    changeEl.innerText = changeText;
                    changeEl.className = `change-section ${colorClass}`;
                    priceEl.className = `current-price ${colorClass}`;
                }
            } catch (error) {
                console.error('抓取股票資料失敗:', error);
                document.getElementById('updateTime').innerText = '更新失敗';
            }
        }

        // 頁面載入後立即抓取，並設定每 5 秒自動重新整理
        fetchStockData();
        setInterval(fetchStockData, 5000);
    </script>

</body>
</html>
