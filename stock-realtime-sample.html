<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台股即時股價監控</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        /* 頂部控制區 */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 10px;
            flex-wrap: wrap;
        }

        .search-box {
            display: flex;
            gap: 8px;
            flex: 1;
            max-width: 400px;
        }

        .search-box input {
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            width: 100%;
        }

        .search-box input:focus {
            border-color: #007AFF;
        }

        .add-btn {
            background-color: #34C759;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }

        .nav-test-btn {
            background-color: #007AFF;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 16px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        /* 網格佈局 (Grid) */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 16px;
        }

        /* 股票卡片樣式 */
        .card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            padding: 16px;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .delete-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            background: #ff3b30;
            color: white;
            border: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            font-size: 12px;
            line-height: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header {
            border-bottom: 1px solid #eee;
            padding-bottom: 8px;
            margin-bottom: 12px;
            padding-right: 24px;
        }

        .symbol {
            font-size: 1.25rem;
            font-weight: bold;
            color: #1a1a1a;
        }

        .code {
            font-size: 0.85rem;
            color: #666;
            margin-left: 6px;
        }

        .price-section {
            text-align: center;
            margin-bottom: 12px;
        }

        .current-price {
            font-size: 2rem;
            font-weight: bold;
            color: #333;
        }

        .change-section {
            font-size: 0.95rem;
            font-weight: 600;
            margin-top: 2px;
        }

        .up { color: #e53935; }
        .down { color: #43a047; }
        .flat { color: #666666; }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            background: #f8f9fa;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.85rem;
        }

        .stat-item {
            text-align: center;
        }

        .stat-label {
            color: #888;
            font-size: 0.75rem;
            margin-bottom: 2px;
        }

        .stat-value {
            font-weight: 600;
            color: #333;
        }

        .footer {
            margin-top: 10px;
            font-size: 0.7rem;
            color: #aaa;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 頂部列：新增與頁面跳轉 -->
        <div class="top-bar">
            <div class="search-box">
                <input type="text" id="stockInput" placeholder="輸入台股代碼 (例如: 2454)" />
                <button class="add-btn" onclick="addStockFromInput()">+ 新增股票</button>
            </div>
            <button class="nav-test-btn" onclick="location.href='./index.html'">test</button>
        </div>

        <!-- 股票卡片容器 -->
        <div class="grid-container" id="stockGrid"></div>
    </div>

    <script>
        const API_BASE_URL = 'https://stock-note-vjok.onrender.com/api/stock/';
        const STORAGE_KEY = 'monitored_stock_codes';
        const DEFAULT_STOCKS = ['2330', '2308', '2603']; // 預設 3 個股票代號

        let stockCodes = [];

        // 初始化代號清單 (優先使用 LocalStorage)
        function initStockCodes() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try {
					if(stockCodes.length==0){
						stockCodes = [...DEFAULT_STOCKS];
					} else {
						stockCodes = JSON.parse(saved);
					}
                } catch(e) {
                    stockCodes = [...DEFAULT_STOCKS];
                }
            } else {
                stockCodes = [...DEFAULT_STOCKS];
            }
            saveStockCodes();
        }

        function saveStockCodes() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(stockCodes));
        }

        // 動態建立卡片的 HTML DOM 框架
        function createCardDOM(code) {
            const grid = document.getElementById('stockGrid');
            const card = document.createElement('div');
            card.className = 'card';
            card.id = `card-${code}`;
            card.innerHTML = `
                <button class="delete-btn" onclick="removeStock('${code}')">✕</button>
                <div class="header">
                    <span class="symbol" id="name-${code}">載入中...</span>
                    <span class="code">${code}</span>
                </div>
                <div class="price-section">
                    <div class="current-price" id="price-${code}">---</div>
                    <div class="change-section" id="change-${code}">--</div>
                </div>
                <div class="stats-grid">
                    <div class="stat-item">
                        <div class="stat-label">最高價</div>
                        <div class="stat-value" id="high-${code}">---</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">最低價</div>
                        <div class="stat-value" id="low-${code}">---</div>
                    </div>
                    <div class="stat-item" style="grid-column: span 2; border-top: 1px dashed #ddd; padding-top: 4px; margin-top: 2px;">
                        <div class="stat-label">成交量 (張)</div>
                        <div class="stat-value" id="vol-${code}">---</div>
                    </div>
                </div>
                <div class="footer">
                    資料時間: <span id="time-${code}">--:--:--</span>
                </div>
            `;
            grid.appendChild(card);
        }

        // 呼叫 API 並更新特定卡片內容
        async function fetchSingleStock(code) {
            try {
                const response = await fetch(`${API_BASE_URL}${code}`);
                const result = await response.json();

                if (result.success && result.data) {
                    const stock = result.data;
                    document.getElementById(`name-${code}`).innerText = stock.name;
                    document.getElementById(`price-${code}`).innerText = stock.price.toLocaleString();
                    document.getElementById(`high-${code}`).innerText = stock.high.toLocaleString();
                    document.getElementById(`low-${code}`).innerText = stock.low.toLocaleString();
                    document.getElementById(`vol-${code}`).innerText = stock.volume.toLocaleString();
                    document.getElementById(`time-${code}`).innerText = stock.time;

                    // 計算漲跌狀態與百分比
                    const changeEl = document.getElementById(`change-${code}`);
                    const priceEl = document.getElementById(`price-${code}`);
                    const changePercent = ((stock.change / stock.yesterdayClose) * 100).toFixed(2);

                    let changeText = '';
                    let colorClass = 'flat';

                    if (stock.change > 0) {
                        changeText = `▲ +${stock.change} (+${changePercent}%)`;
                        colorClass = 'up';
                    } else if (stock.change < 0) {
                        changeText = `▼ ${stock.change} (${changePercent}%)`;
                        colorClass = 'down';
                    } else {
                        changeText = `0.00 (0.00%)`;
                        colorClass = 'flat';
                    }

                    changeEl.innerText = changeText;
                    changeEl.className = `change-section ${colorClass}`;
                    priceEl.className = `current-price ${colorClass}`;
                    return true;
                } else {
                    return false;
                }
            } catch (error) {
                console.error(`抓取 ${code} 資料失敗:`, error);
                document.getElementById(`time-${code}`).innerText = '更新失敗';
                return false;
            }
        }

        // 走訪並更新目前所有的卡片
        function updateAllStocks() {
            stockCodes.forEach(code => fetchSingleStock(code));
        }

        // 新增股票
        async function addStockFromInput() {
            const input = document.getElementById('stockInput');
            const code = input.value.trim();

            if (!code) {
                alert('請輸入股票代碼！');
                return;
            }

            if (stockCodes.includes(code)) {
                alert('該股票已在清單中！');
                input.value = '';
                return;
            }

            // 先建立 DOM 節點
            createCardDOM(code);
            const success = await fetchSingleStock(code);

            if (success) {
                stockCodes.push(code);
                saveStockCodes();
                input.value = '';
            } else {
                alert(`無法獲取代碼 [${code}] 的資料，請確認代碼是否正確。`);
                const card = document.getElementById(`card-${code}`);
                if (card) card.remove();
            }
        }

        // 刪除股票
        function removeStock(code) {
            stockCodes = stockCodes.filter(c => c !== code);
            saveStockCodes();
            const card = document.getElementById(`card-${code}`);
            if (card) card.remove();
        }

        // 初始化渲染與設定 Interval
        window.onload = () => {
            initStockCodes();
            document.getElementById('stockGrid').innerHTML = '';
            
            // 建立初始預設卡片
            stockCodes.forEach(code => createCardDOM(code));
            
            // 立即抓取一次資料，之後每 5 秒輪詢
            updateAllStocks();
            setInterval(updateAllStocks, 5000);
        };
    </script>
</body>
</html>
